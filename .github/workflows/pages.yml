name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci
      - run: npm run check
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop and phone playback tests
        id: e2e
        env:
          E2E_SUITE: Norikae
        run: npm run test:e2e
      - name: Upload E2E report, screenshots and traces
        id: e2e-report
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Link E2E report in run summary
        if: ${{ !cancelled() && steps.e2e-report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.e2e-report.outputs.artifact-url }}
        run: |
          printf '\n[Download E2E reports, screenshots and traces](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
